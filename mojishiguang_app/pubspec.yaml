name: mojishiguang
description: "墨迹时光 - 基于多模态AI的古籍残片智能修复与数字人文互动平台"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.2.0

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # 路由
  go_router: ^14.0.0

  # 网络请求
  dio: ^5.4.0
  retrofit: ^4.1.0

  # 本地存储
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0

  # 数据模型
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0

  # 图像处理
  image_picker: ^1.0.0
  camera: ^0.10.0
  photo_view: ^0.15.0
  flutter_image_compress: ^2.1.0
  cached_network_image: ^3.3.0
  image: ^4.1.0

  # UI 组件
  flutter_svg: ^2.0.0
  lottie: ^3.0.0
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  flutter_staggered_animations: ^1.1.0

  # 分享与导出
  share_plus: ^10.0.0
  screenshot: ^2.1.0
  path: ^1.9.0

  # 平台工具
  permission_handler: ^11.3.0
  device_info_plus: ^11.0.0
  package_info_plus: ^9.0.1
  connectivity_plus: ^6.0.0

  # 国际化
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0

  # 工具库
  equatable: ^2.0.0
  collection: ^1.18.0
  uuid: ^4.3.0
  async: ^2.11.0
  meta: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 代码生成
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  drift_dev: ^2.16.0
  retrofit_generator: ^9.0.0

  # 测试
  mocktail: ^1.0.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/models/
    - assets/animations/

  fonts:
    - family: SourceHanSerifSC
      fonts:
        - asset: assets/fonts/SourceHanSerifSC-Regular.otf
        - asset: assets/fonts/SourceHanSerifSC-Bold.otf
          weight: 700
        - asset: assets/fonts/SourceHanSerifSC-ExtraLight.otf
          weight: 200
