// -----------------------------------------------------------------------------
// Android 应用级构建配置
// 依赖 NNAPI Runtime、CameraX、ML Kit 中文文字识别等。
// -----------------------------------------------------------------------------

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "io.github.qianchang.mojishiguang"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId = "io.github.qianchang.mojishiguang"
        minSdk = 26
        targetSdk = 35
        versionCode = 1
        versionName = "1.0.0"
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // NNAPI Runtime
    implementation 'androidx.neuralnetwork:neuralnetwork-runtime:1.0.0-alpha09'

    // CameraX
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'

    // ML Kit 中文文字识别
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.0'
}
